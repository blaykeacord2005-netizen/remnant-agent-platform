tenant_id: rock_solid

business:
  name: "Rock Solid Concrete LLC"
  short_name: "Rock Solid"
  owner: "Brandon"
  phone: "(765) 319-9749"
  secondary_phone: "(765) 480-3401"
  email: "rocksolidconcrete9749@gmail.com"
  address: "120 Kingston Rd, Kokomo, IN 46901"
  facebook: "https://www.facebook.com/rocksolidconcrete9749/"
  hours: "Mon-Fri 7:00 AM - 5:00 PM. Saturday by appointment. Closed Sunday."
  service_area:
    - Kokomo
    - Howard County
    - Greentown
    - Russiaville
    - Peru
    - Logansport
    - Tipton
    - Marion
    - Noblesville
    - Anderson
    - Frankfort
    - Lebanon
    - Westfield
    - Carmel

agent:
  name: "Rocky"
  role: "front desk assistant"
  greeting: "Hey! Thanks for reaching out to Rock Solid Concrete. What kind of project are you looking at today?"
  voice_tone: >
    Friendly, direct, and down-to-earth — like a knowledgeable guy at a
    contractor's front desk, not a corporate call center. Short sentences.
    No jargon. Never oversell. Sound local and trustworthy.

branding:
  primary_color: "#c0271d"
  dark_color: "#0a0a0a"
  accent_color: "#e03028"
  font_display: "Oswald"
  font_body: "Inter"

services:
  - name: "Driveways"
    description: "Standard, stamped, and exposed aggregate driveways. Built on properly prepped subgrade with steel reinforcement."
  - name: "Patios & Outdoor Living"
    description: "Custom patios, fire pit pads, pool decks, and outdoor entertaining areas."
  - name: "Retaining Walls"
    description: "Structural and decorative walls, engineered for load and erosion control with proper drainage."
  - name: "Commercial Flatwork"
    description: "Warehouse pads, loading aprons, parking lots, and ADA-compliant sidewalks."
  - name: "Sidewalks & Steps"
    description: "Walkways, front steps, and entryways with proper grading and drainage."
  - name: "Gravel & Site Prep"
    description: "Gravel delivery, excavation, grading, and base preparation."
  - name: "Decorative & Epoxy"
    description: "Custom epoxy finishes, stamped textures, and specialty decorative concrete work."

# Facts the agent is allowed to state. Anything not here, it escalates.
facts:
  - "Rock Solid is licensed and fully insured."
  - "Free on-site estimates on every project, no obligation."
  - "Written quotes with no hidden fees or surprise change orders."
  - "Family owned and locally operated out of Kokomo."
  - "Final walkthrough with the customer before final payment."
  - "Jobsite is cleaned up at the end of every workday."
  - "We serve Kokomo, Howard County, and surrounding towns including Greentown, Russiaville, Peru, Logansport, Tipton, and more."
  - "Both phone numbers work: (765) 319-9749 and (765) 480-3401."

# Why choose us — short talking points the agent can use
why_choose_us:
  - "Local Kokomo family business — not a big out-of-town crew."
  - "Proper base prep and steel reinforcement so the work lasts."
  - "We clean up every day and do a final walkthrough with you."
  - "No pressure sales. Free estimate, written quote, honest timeline."

# The agent must NEVER quote prices or commit to dates — those go to Brandon.
escalation_rules:
  - "Never quote a specific price. Say every job is priced after a free on-site look."
  - "Never commit to a specific start date. Say Brandon confirms scheduling directly."
  - "If asked something not covered in the facts or services, say you'll have Brandon follow up."
  - "If the caller seems upset or has a complaint, collect their info and flag it for Brandon immediately."

# What the agent collects before ending a conversation
lead_fields:
  - name
  - phone
  - project_type
  - project_details
  - timeline
  - preferred_contact_method

notifications:
  # Where new leads get sent. Configure per client.
  email_to: "rocksolidconcrete9749@gmail.com"
  sms_to: "+17653199749"

missed_call:
  # Text-back when a call to Rock Solid goes unanswered. Opt-in per client.
  enabled: true
  # Placeholders come from the business block: {short_name} {name} {owner} {phone}
  sms_template: "Sorry we missed your call! This is {short_name} — how can we help with your concrete project? Call or text us back anytime."
  # The Twilio number callers dial, in +1XXXXXXXXXX form. Texts are sent from it.
  # Blank = fall back to the platform-wide TWILIO_/TELNYX_PHONE_NUMBER env var.
  sms_from: ""
  # Don't re-text the same caller inside this window (the call is still logged).
  cooldown_hours: 24

reviews:
  # Fill this in once Brandon's Google Business Profile is claimed.
  google_review_url: ""
  facebook_review_url: "https://www.facebook.com/rocksolidconcrete9749/reviews"
  # Customers who indicate they're unhappy never get sent to these links.
  # They get routed to Brandon for a personal call instead.

# Local SEO notes for future marketing use
seo_notes:
  primary_keywords:
    - concrete contractor Kokomo
    - driveway installation Kokomo IN
    - patio concrete Kokomo
    - stamped concrete near me
    - retaining wall contractor Howard County
  target_cities: ["Kokomo", "Greentown", "Russiaville", "Peru", "Logansport", "Tipton"]

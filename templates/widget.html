<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --primary:#c0271d; --dark:#0a0a0a; --accent:#e03028;
    --surface:#141414; --surface2:#1c1c1c; --border:#2a2a2a;
    --text:#f0ece6; --text2:#a8a29e; --text3:#6b665f;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--dark);color:var(--text);-webkit-font-smoothing:antialiased}

  @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  @keyframes spin{to{transform:rotate(360deg)}}

  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;background:var(--dark)}

  .hdr{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .hdr-l{display:flex;align-items:center;gap:12px}
  .avatar{
    width:40px;height:40px;border-radius:10px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:#fff;flex-shrink:0;
  }
  .hdr-name{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .hdr-status{font-size:10px;color:#4ade80;display:flex;align-items:center;gap:5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-top:1px}
  .hdr-status::before{content:'';width:5px;height:5px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
  .call-btn{
    background:var(--primary);color:#fff;text-decoration:none;
    padding:9px 16px;border-radius:7px;font-size:12px;font-weight:700;
    display:flex;align-items:center;gap:6px;transition:background .2s;white-space:nowrap;
  }
  .call-btn:hover{background:var(--accent)}

  .msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .msgs::-webkit-scrollbar{width:4px}
  .msgs::-webkit-scrollbar-thumb{background:#333;border-radius:2px}

  .m{max-width:88%;animation:slideUp .25s ease;font-size:14.5px;line-height:1.6}
  .m-bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);padding:12px 16px;border-radius:4px 14px 14px 14px}
  .m-user{align-self:flex-end;background:var(--primary);color:#fff;padding:12px 16px;border-radius:14px 14px 4px 14px}
  .m-time{font-size:9px;color:var(--text3);margin-top:5px;letter-spacing:.04em}
  .m-user .m-time{color:rgba(255,255,255,.6);text-align:right}

  .typing{
    align-self:flex-start;display:flex;align-items:center;gap:9px;
    background:var(--surface2);border:1px solid var(--border);
    padding:12px 16px;border-radius:4px 14px 14px 14px;font-size:13px;color:var(--text2);
  }
  .sp{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}

  .quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}
  .qb{
    background:var(--surface2);border:1px solid var(--border);border-radius:18px;
    padding:8px 15px;font-size:12.5px;color:var(--text2);cursor:pointer;transition:all .2s;
  }
  .qb:hover{border-color:var(--primary);color:var(--primary)}

  .input-area{flex-shrink:0;padding:12px 16px 20px;border-top:1px solid var(--border);background:var(--surface)}
  .input-row{display:flex;gap:9px;align-items:flex-end}
  .inp{
    flex:1;background:var(--dark);border:1px solid var(--border);border-radius:11px;
    padding:13px 16px;font-family:'Inter',sans-serif;font-size:15px;color:var(--text);
    outline:none;resize:none;min-height:46px;max-height:110px;line-height:1.4;transition:border-color .2s;
  }
  .inp:focus{border-color:var(--primary)}
  .inp::placeholder{color:var(--text3)}
  .send{
    width:46px;height:46px;border-radius:11px;border:none;background:var(--primary);
    color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:19px;transition:background .2s;flex-shrink:0;
  }
  .send:hover{background:var(--accent)}
  .send:disabled{opacity:.4;cursor:default}
  .foot{font-size:10px;color:var(--text3);text-align:center;margin-top:9px;letter-spacing:.03em}

  @supports(padding-bottom:env(safe-area-inset-bottom)){
    .input-area{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-l">
      <div class="avatar" id="avatar">R</div>
      <div>
        <div class="hdr-name" id="agentName">Loading…</div>
        <div class="hdr-status">Online 24/7</div>
      </div>
    </div>
    <a class="call-btn" id="callBtn" href="#">Call</a>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="quick" id="quick">
    <div class="qb" onclick="q('What services do you offer?')">Services</div>
    <div class="qb" onclick="q('Do you service my area?')">Service area</div>
    <div class="qb" onclick="q('I need a quote for a driveway')">Get a quote</div>
    <div class="qb" onclick="q('How does the process work?')">How it works</div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea class="inp" id="inp" rows="1" placeholder="Type your message…"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
        oninput="grow(this)"></textarea>
      <button class="send" id="sendBtn" onclick="send()">→</button>
    </div>
    <div class="foot" id="foot">Powered by Remnant Co</div>
  </div>
</div>

<script>
const TENANT = "{{TENANT_ID}}";
const SID = "s_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
let busy = false, CFG = null;

function grow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,110)+'px'; }
function t(){ return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(s){ return esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br/>'); }

async function init(){
  try{
    const r = await fetch(`/${TENANT}/api/config`);
    CFG = await r.json();
    const b = CFG.branding || {};
    if(b.primary_color) document.documentElement.style.setProperty('--primary', b.primary_color);
    if(b.accent_color)  document.documentElement.style.setProperty('--accent',  b.accent_color);
    if(b.dark_color)    document.documentElement.style.setProperty('--dark',    b.dark_color);

    document.getElementById('agentName').textContent = CFG.agent_name + ' · ' + CFG.short_name;
    document.getElementById('avatar').textContent = (CFG.agent_name||'A')[0].toUpperCase();
    document.title = CFG.business_name;

    const cb = document.getElementById('callBtn');
    cb.href = 'tel:' + (CFG.phone||'').replace(/\D/g,'');
    cb.textContent = '📞 Call';

    add('bot', CFG.greeting);
  }catch(e){
    add('bot', "Sorry — I'm having trouble connecting right now.");
  }
}

function add(who, text){
  const el = document.createElement('div');
  el.className = 'm ' + (who==='user' ? 'm-user' : 'm-bot');
  el.innerHTML = (who==='user'? esc(text) : md(text)) + `<div class="m-time">${t()}</div>`;
  const box = document.getElementById('msgs');
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

function q(text){ document.getElementById('inp').value = text; send(); }

async function send(){
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if(!text || busy) return;

  document.getElementById('quick').style.display='none';
  add('user', text);
  inp.value=''; inp.style.height='auto';
  busy = true;
  document.getElementById('sendBtn').disabled = true;

  const box = document.getElementById('msgs');
  const typing = document.createElement('div');
  typing.className='typing'; typing.id='typing';
  typing.innerHTML = '<div class="sp"></div>Typing…';
  box.appendChild(typing); box.scrollTop = box.scrollHeight;

  try{
    const r = await fetch(`/${TENANT}/api/chat`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:text, session_id:SID })
    });
    const d = await r.json();
    document.getElementById('typing')?.remove();
    add('bot', d.reply || "Something went wrong — try calling us directly.");
  }catch(e){
    document.getElementById('typing')?.remove();
    add('bot', "Connection issue. Give us a call and we'll take care of you.");
  }

  busy = false;
  document.getElementById('sendBtn').disabled = false;
  inp.focus();
}

init();
</script>
</body>
</html>
